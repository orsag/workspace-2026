<div
  class="card h-[340px] w-full bg-base-100 shadow-sm border border-base-300 hover:shadow-xl hover:-translate-y-1 transition-all duration-300 group"
>
  <figure class="px-4 pt-4 cursor-pointer" [routerLink]="['/book', data.id]">
    <div class="relative w-full h-52 bg-base-200 rounded-xl overflow-hidden flex items-center justify-center group-hover:bg-primary/5 transition-colors">

      <img [ngSrc]="data.coverUrl || 'images/placeholder.webp'"
           [priority]="isPriority"
           width="120"
           height="160"
           class="h-40 w-auto object-contain drop-shadow-md transition-transform duration-500 group-hover:scale-110"
           [alt]="`Book Cover ${data.title}`">

      @if (data.availableCount > 0) {
        <button
          (click)="$event.stopPropagation(); onAddToCart()"
          class="absolute top-2 left-2 p-2 rounded-full bg-base-100/80 backdrop-blur-sm shadow-sm transition-all hover:scale-110 hover:text-primary active:scale-95 z-10 text-base-content cursor-pointer"
          title="Add to Cart">
          <app-icon name="SmallCart"></app-icon>
        </button>
      }

      <button
        (click)="$event.stopPropagation(); toggleFavorite(data.id)"
        class="absolute top-2 right-2 p-2 rounded-full bg-base-100/80 backdrop-blur-sm shadow-sm transition-all hover:scale-110 active:scale-95 z-10"
        [class.text-error]="isFavorite()"
        [class.text-base-content]="!isFavorite()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [attr.fill]="isFavorite() ? 'currentColor' : 'none'">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
        </svg>
      </button>
    </div>
  </figure>

  <div class="card-body p-5 flex flex-col overflow-hidden">
    <div class="flex justify-between items-start mb-2 shrink-0">
      <span class="badge badge-secondary badge-outline badge-sm uppercase tracking-wider font-semibold">
        {{ data.category }}
      </span>
      <span class="text-sm font-bold text-primary">{{ data.price | currency:'EUR' }}</span>
    </div>

    <div class="space-y-1 shrink-0">
      <h2 class="card-title text-sm font-bold line-clamp-1 group-hover:text-primary transition-colors leading-tight">
        {{ data.title }}
      </h2>
      <p class="text-xs text-base-content/70 italic">by {{ data.author }}</p>
    </div>

    <div class="flex-grow"></div>
  </div>
</div>
