<div class="navbar bg-base-100 shadow-sm">

  <!-- MENU button and TITLE -->
  <div class="flex-1 flex items-center gap-2">
    <button
      (click)="toggleSearchbar()"
      class="btn btn-ghost btn-sm btn-square lg:flex"
      [class.bg-base-200]="showFilter()"
      aria-label="Toggle Sidebar">
      <app-icon [name]="showFilter() ? 'Menu' : 'Menu'" class="opacity-70 h-5 w-5"></app-icon>
    </button>

    <a routerLink="/" class="btn btn-ghost text-xl px-2">BookShop</a>
  </div>

  <div class="flex items-center gap-2">

    <button
      (click)="toggleLang()"
      class="btn btn-ghost btn-sm gap-2 rounded-sm px-3 font-bold hover:bg-base-200 transition-colors"
      [title]="activeLang() === 'en' ? 'Prepnúť do slovenčiny' : 'Switch to English'">

      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 11.37 9.198 15.287 6 17.5" />
      </svg>

      <span class="uppercase text-xs">{{ activeLang() === 'en' ? 'SK' : 'EN' }}</span>
    </button>

    <!-- LOGIN / LOGOUT -->
    @if (!isLoggedIn()) {
      <button (click)="handleLogin()" class="btn btn-ghost btn-sm gap-2 rounded-sm px-4">
        <app-icon name="Login" class="h-4 w-4"></app-icon>
        <span>Login</span>
      </button>
    } @else {
      <button (click)="handleLogout()" class="btn btn-ghost btn-sm gap-2 rounded-sm px-4">
        <app-icon name="Logout" class="h-4 w-4"></app-icon>
        <span>Logout</span>
      </button>
    }

    <!-- SEARCHBAR -->
    @if (showSearchbar()) {
      <input type="text" placeholder="Search" class="input input-bordered w-34 md:w-auto" />
    }

    <!-- CART ICON -->
    <button
      routerLink="/shopping"
      class="btn btn-ghost btn-sm btn-square relative group"
      aria-label="View Shopping Cart">
      <div class="indicator">
        @if (cartStore.itemCount() > 0) {
          <span class="indicator-item badge badge-primary badge-xs font-bold border-none shadow-sm scale-90 mt-1">
        {{ cartStore.itemCount() }}
      </span>
        }
        <svg xmlns="http://www.w3.org/2000/svg"
             class="h-5 w-5 opacity-70 group-hover:opacity-100 transition-opacity"
             fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
      </div>
    </button>

    <!-- THEME -->
    <app-theme-picker></app-theme-picker>

    <!-- DROPDOWN AVATAR -->
    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
        <div class="w-10 rounded-full">
          <img
            fetchpriority="low"
            alt="User Avatar"
            width="40"
            height="40"
            ngSrc="images/sova.webp" />
        </div>
      </div>
      <ul
        tabindex="-1"
        class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">

        @if (isLoggedIn() && isAdmin()) {
          <li><a routerLink="administration" (click)="closeDropdown($event)">Administration</a></li>
        }

        @if (isLoggedIn()) {
          <li>
            <a routerLink="/profile" class="justify-between" (click)="closeDropdown($event)">
              Profile
              <span class="badge text-sm">{{ userName()?.username }}</span>
            </a>
          </li>
          <li><a (click)="logout($event)" role="button" tabindex="0">Logout</a></li>
        }

        <li><a routerLink="/features" (click)="closeDropdown($event)">Features</a></li>
      </ul>
    </div>
  </div>
</div>

@if (showLoginModal()) {
  <div class="modal" [class.modal-open]="showLoginModal()">
    <div class="modal-box max-w-sm">
      <h3 class="font-bold text-lg mb-4">Prihlásenie</h3>

      <form (submit)="onLoginSubmit($event)" class="space-y-4">
        <div class="form-control">
          <label for="loginModalName" class="label"><span class="label-text">Meno</span></label>
          <input id="loginModalName" type="text" placeholder="Vaše meno" class="input input-bordered w-full" required
                 name="loginModalName" [(ngModel)]="modelUsername" />
        </div>

        <!--        <div class="form-control">-->
        <!--          <label for="loginModalPassword" class="label"><span class="label-text">Heslo</span></label>-->
        <!--          <input id="loginModalPassword" type="password" placeholder="••••••••" class="input input-bordered w-full" required />-->
        <!--        </div>-->

        <div class="modal-action">
          <button type="button" (click)="showLoginModal.set(false)" class="btn btn-ghost">Zrušiť</button>
          <button type="submit" class="btn btn-primary">Prihlásiť sa</button>
        </div>
      </form>
    </div>

    <div
      class="modal-backdrop"
      role="button"
      tabindex="0"
      aria-label="Zatvoriť okno"
      (click)="showLoginModal.set(false)"
      (keydown.enter)="showLoginModal.set(false)"
      (keydown.space)="showLoginModal.set(false)">
    </div>
  </div>
}
