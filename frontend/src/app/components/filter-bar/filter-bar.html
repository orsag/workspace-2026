<div class="hidden sm:flex flex-wrap items-start gap-3 mb-8" *transloco="let t">
  @for (filter of filters(); track filter.label) {
    <button (click)="filter.action()"
            class="btn btn-sm rounded-full transition-all disabled:[&_img]:opacity-50 disabled:[&_img]:grayscale"
            [class.btn-success]="filter.isActive()"
            [class.btn-soft]="!filter.isActive()"
            [disabled]="isCoolingDown()">

      @if (filter.icon === 'all') {
        <img ngSrc="/images/worldwide.png" width="20" height="20" alt="Everything" />
      } @else if (filter.icon === 'bestsellers') {
        <img ngSrc="/images/star.png" width="20" height="20" alt="Bestsellers" />
      } @else if (filter.icon === 'newreleases') {
        <img ngSrc="/images/books.png" width="20" height="20" alt="Bestsellers" />
      } @else if (filter.icon === 'expensive') {
        <img ngSrc="/images/diamond.png" width="20" height="20" alt="Bestsellers" />
      } @else if (filter.icon === 'cheapest') {
        <img ngSrc="/images/piggybank.png" width="20" height="20" alt="Bestsellers" />
      } @else if (filter.icon === 'discount') {
        <img ngSrc="/images/discount.png" width="20" height="20" alt="Bestsellers" />
      }

      {{ t('filters.' + filter.label) }}

    </button>
  }

  @if (cartStore.itemCount() > 0) {
    <button routerLink="/shopping"
            class="btn btn-soft btn-sm rounded-full transition-all"
            [disabled]="isCoolingDown()">
        <img ngSrc="/images/cart.png" width="20" height="20" alt="Bestsellers" />
      {{ t('filters.bar.to_cart') }} ({{ cartStore.itemCount() }})
    </button>
  }

  @if (store.isLoggedIn()) {
    <button routerLink="/profile"
            class="btn btn-soft btn-sm rounded-full transition-all"
            [class.ml-auto]="cartStore.itemCount() === 0"
            [disabled]="isCoolingDown()">
      <img ngSrc="/images/user.png" width="20" height="20" alt="Bestsellers" />
      {{ t('filters.bar.profile') }}
    </button>
  }

</div>
