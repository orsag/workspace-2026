<div class="flex flex-col gap-6 p-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-base-content">Administrácia</h1>
      <p class="text-sm text-base-content/60">Spravujte svoj katalóg kníh a skladové zásoby</p>
    </div>

    <button
      type="button"
      class="btn btn-primary gap-2 shadow-md"
      (click)="openCreateModal()">
      <app-icon name="Plus" class="h-4 w-4"></app-icon>
      Pridať knihu
    </button>
  </div>

  <div class="w-full bg-base-100 shadow-sm">
    <app-order-table></app-order-table>
  </div>

  <div class="w-full bg-base-100 shadow-sm">
    <app-book-table (edit)="openEditModal($event)"
                    (remove)="openDeleteConfirmation($event)">
    </app-book-table>
  </div>

</div>

@if (isDeleteModalOpen()) {
  <dialog class="modal modal-open">
    <div class="modal-box border border-error/20">
      <h3 class="font-bold text-lg text-error">Odstrániť knihu?</h3>
      <p class="py-4">Naozaj chcete vymazať knihu <strong>{{ selectedBook()?.title }}</strong>?</p>
      <div class="modal-action">
        <button class="btn btn-ghost" (click)="closeModals()">Zrušiť</button>
        <button class="btn btn-error text-white" (click)="confirmDelete()">Vymazať</button>
      </div>
    </div>
    <div
      class="modal-backdrop"
      role="button"
      tabindex="0"
      aria-label="Zatvoriť okno"
      (click)="closeModals()"
      (keydown.enter)="closeModals()"
      (keydown.space)="closeModals()">
    </div>
  </dialog>
}

@if (isEditModalOpen()) {
  <app-edit-modal [selectedBook]="selectedBook()" (closeModal)="closeModals()"></app-edit-modal>
}
