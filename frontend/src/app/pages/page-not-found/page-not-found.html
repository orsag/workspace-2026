    <p class="text-primary font-mono text-5xl font-semibold">404</p>

    <h1 class="mt-4 text-3xl font-bold tracking-tight text-base-content sm:text-5xl">

    <p class="mt-6 text-lg leading-7 text-base-content/70">

    <div class="mt-10 flex items-center justify-center gap-x-6">
      <a

        class="btn btn-primary shadow-sm"

        class="btn btn-ghost"
